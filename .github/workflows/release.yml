name: Release

# Tag a version (git tag v0.2.0 && git push origin v0.2.0) and this builds the
# DMG on an Apple Silicon runner and publishes it to the PUBLIC downloads repo
# (soummyaanon/DEV-island-releases) — source stays here in the private repo.
#
# Requires a repo secret RELEASES_TOKEN: a token with `contents: write` on the
# public releases repo (the default GITHUB_TOKEN can't write across repos).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASES_REPO: soummyaanon/DEV-island-releases
  # True only when the cross-repo publish token is configured. Until then the
  # run still succeeds and uploads the DMG as a build artifact instead.
  HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
  HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}

jobs:
  build-and-release:
    # macOS 26 image (arm64, Xcode 26): the native helper needs the macOS 26
    # SDK for Apple Intelligence (FoundationModels) and on-device voice
    # (SpeechAnalyzer). An older runner still builds, but ships "basic" mode.
    # macOS 26 image (arm64, Xcode 26): Apple Intelligence (FoundationModels)
    # and on-device voice (SpeechAnalyzer) need the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      # The native app's own suite, including the daemon's parity tests: a
      # release that would break approvals never gets built.
      - name: Test
        working-directory: apps/mac
        run: ./scripts/test.sh

      # Optional Developer ID: with MACOS_CERTIFICATE (a base64 .p12) and its
      # password set, the app is signed with the hardened runtime and, with the
      # NOTARY_* secrets too, the DMG is notarised. Without them the build is
      # ad-hoc signed, as 1.x ships: users approve it once in Privacy & Security.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build release DMG
        working-directory: apps/mac
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: ./scripts/dmg.sh

      # Notes: the annotated tag's message, written for users (git tag -a).
      # GitHub's generated notes only link into THIS private repo, which the
      # public can't open — they are the fallback for a lightweight tag.
      - name: Release notes from the tag message
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --quiet origin "refs/tags/$TAG:refs/tags/$TAG" || true
          body="$(git tag -l --format='%(contents)' "$TAG" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            body="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body)"
          fi
          {
            echo "body<<__NOTES__"
            printf '%s\n' "$body"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish DMG to public downloads repo
        if: env.HAS_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: apps/mac/build/Agent-Island.dmg

      # Fallback when RELEASES_TOKEN isn't set yet: keep the build green and make
      # the DMG downloadable from the run, without leaking source to a release.
      - name: Upload DMG as artifact (RELEASES_TOKEN not set)
        if: env.HAS_TOKEN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Island-dmg
          path: apps/mac/build/Agent-Island.dmg

      - name: Warn that RELEASES_TOKEN is missing
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::RELEASES_TOKEN secret not set — DMG uploaded as an artifact instead of published to ${RELEASES_REPO}. Add the secret to enable automated releases."
