name: Release

# Tag a version (git tag v0.2.0 && git push origin v0.2.0) and this builds the
# signed DMG on an Apple Silicon runner and attaches it to the GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14 # arm64 — the app currently ships Apple Silicon only
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Without Apple credentials this produces an ad-hoc signed build. Users
      # must approve it once through Privacy & Security → Open Anyway.
      - name: Build release DMG
        run: pnpm package

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/app/release/*.dmg
          generate_release_notes: true
