name: Release

# Tag a version (git tag v0.2.0 && git push origin v0.2.0) and this builds the
# DMG on an Apple Silicon runner and publishes it to the PUBLIC downloads repo
# (soummyaanon/DEV-island-releases) — source stays here in the private repo.
#
# Requires a repo secret RELEASES_TOKEN: a token with `contents: write` on the
# public releases repo (the default GITHUB_TOKEN can't write across repos).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASES_REPO: soummyaanon/DEV-island-releases

jobs:
  build-and-release:
    runs-on: macos-14 # arm64 — the app currently ships Apple Silicon only
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Without Apple credentials this produces an ad-hoc signed build. Users
      # must approve it once through Privacy & Security → Open Anyway.
      - name: Build release DMG
        run: pnpm package

      # Notes come from THIS (source) repo's commits — the public repo has no
      # history of its own worth summarizing.
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "body<<__NOTES__"
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ github.ref_name }}" --jq .body
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish DMG to public downloads repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: packages/app/release/*.dmg
