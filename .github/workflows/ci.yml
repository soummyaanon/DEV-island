name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  # The native rewrite (docs/superpowers/plans/2026-09-26-swift-native-island.md).
  native:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v7

      - run: swift --version

      - run: ./scripts/test.sh

      - run: ./scripts/bundle.sh
