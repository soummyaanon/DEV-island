name: Bug report
description: Something on the island isn't working as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. The more of this you fill in, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Claude Code session in iTerm2
        2. Hover the notch
        3. ...
  - type: input
    id: version
    attributes:
      label: Agent Island version
      description: In Finder, select Agent Island in Applications and press ⌘I.
      placeholder: "2.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Pro 14-inch (M3)"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Cursor
        - None (quick tools, notch, settings)
  - type: dropdown
    id: placement
    attributes:
      label: Island position
      options:
        - Top (notch)
        - Left edge
        - Right edge
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 'Optional. Run `/usr/bin/log show --last 5m --predicate ''subsystem == "com.agentisland.app"''` right after it happens.'
      render: shell
