appId: com.agentisland.app
productName: Agent Island
directories:
  output: release
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  extendInfo:
    LSUIElement: true
# Ship only English Electron locales — trims ~50 unused language packs.
electronLanguages:
  - en
files:
  - out/**/*
  - package.json
# Bundle the self-contained daemon so the packaged app can spawn it.
extraResources:
  - from: ../daemon/dist/main.cjs
    to: daemon/main.cjs
