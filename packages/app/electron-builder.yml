appId: com.agentisland.app
productName: Agent Island
# No native Node modules in this app (ws's optional natives aren't installed),
# so there is nothing for @electron/rebuild to do — and its node_modules walk
# trips over pnpm's dangling symlinks for other platforms' optional binaries
# (@esbuild/aix-ppc64, @rollup/rollup-linux-*), which fails the pack step.
npmRebuild: false
directories:
  output: release
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  extendInfo:
    LSUIElement: true
    # The sidecar asks CoreLocation for a fix, but TCC attributes the request to
    # the RESPONSIBLE process — this app — so the usage description has to live
    # here too, not only in the sidecar's embedded plist. Weather still works
    # without any grant (timezone fallback); this only enables the precise path.
    NSLocationWhenInUseUsageDescription: >-
      Agent Island uses your approximate location to show local weather in the
      notch. Coordinates are rounded to about a kilometre and sent only to
      open-meteo.com.
    # Voice mode. The sidecar captures the mic, but TCC asks on behalf of the
    # responsible app — this one — so the description lives here too.
    NSMicrophoneUsageDescription: >-
      Agent Island listens only while voice mode is on, to hear your question.
      Speech is transcribed on this Mac and never sent anywhere.
    # macOS 12–15 only: the older recognizer needs its own grant.
    NSSpeechRecognitionUsageDescription: >-
      On macOS 15 and earlier, Agent Island uses on-device speech recognition
      to understand what you say in voice mode.
# agent-island:// deep links: Focus automations from Shortcuts, toggle, settings.
protocols:
  - name: Agent Island
    schemes:
      - agent-island
# Ship only English Electron locales — trims ~50 unused language packs.
electronLanguages:
  - en
files:
  - out/**/*
  - package.json
# Bundle the self-contained daemon so the packaged app can spawn it, plus the
# native sidecar (haptics). The helper is optional by design — a build without
# swiftc simply omits it and the features that need it go inert.
extraResources:
  - from: ../daemon/dist/main.cjs
    to: daemon/main.cjs
  # Directory, not the file: a checkout built without swiftc leaves this empty
  # rather than making the pack step fail on a missing path.
  - from: native
    to: native
